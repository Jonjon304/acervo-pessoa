<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Acervo Pessoal - Biblioteca digital de PDFs com estantes virtuais e acompanhamento de leitura.">
<title>Acervo Pessoal - Biblioteca Digital</title>
<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/variaveis.css">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/estante.css">
<link rel="stylesheet" href="./css/card.css">
<link rel="stylesheet" href="./css/modal.css">
<link rel="stylesheet" href="./css/form-adicionar.css">
<link rel="stylesheet" href="./css/responsivo.css">
</head>
<body>

<header class="header">
<div class="container header-interno">
<a href="./index.html" class="header-logo" aria-label="Pagina inicial">
<span class="logo-icone" aria-hidden="true">&#128218;</span>
<span class="logo-texto">Acervo Pessoal</span>
</a>
<nav class="header-nav" aria-label="Navegacao principal">
<a href="./categorias/index.html" class="nav-link">Categorias</a>
<button id="btn-adicionar-pdf" class="nav-btn-adicionar" aria-label="Adicionar PDF">
<span aria-hidden="true">+</span> Adicionar
</button>
<div class="nav-sincronizar">
<button id="btn-exportar" class="nav-btn-sinc" aria-label="Exportar progresso">
<span aria-hidden="true">&#128229;</span> Exportar
</button>
<label for="input-importar" class="nav-btn-sinc" aria-label="Importar progresso">
<span aria-hidden="true">&#128228;</span> Importar
</label>
<input type="file" id="input-importar" accept=".json" class="visually-hidden">
</div>
</nav>
</div>
</header>

<main class="main container">

<div id="container-form-adicionar" class="container-form-adicionar" aria-hidden="true">
<form id="form-adicionar-pdf" class="form-adicionar">
<h2 id="form-titulo">Adicionar PDF</h2>

<input type="hidden" id="input-slug-edicao" value="">

<div class="form-grupo">
<label for="input-titulo">Titulo *</label>
<input type="text" id="input-titulo" required placeholder="Ex: Clean Code">
</div>

<div class="form-grupo">
<label for="input-autor">Autor</label>
<input type="text" id="input-autor" placeholder="Ex: Robert C. Martin">
</div>

<div class="form-grupo">
<label for="input-categoria">Categoria *</label>
<select id="input-categoria" required>
<option value="programacao">Programacao</option>
<option value="design">Design</option>
<option value="engenharia">Engenharia</option>
<option value="literatura">Literatura</option>
<option value="ciencia">Ciencia</option>
<option value="negocios">Negocios</option>
<option value="pessoal">Desenvolvimento Pessoal</option>
</select>
</div>

<div class="form-grupo">
<label for="input-link-pdf">Link do PDF * (Google Drive, Dropbox, etc)</label>
<input type="url" id="input-link-pdf" required placeholder="https://drive.google.com/file/d/...">
</div>

<div class="form-grupo">
<label for="input-total-paginas">Total de Paginas</label>
<input type="number" id="input-total-paginas" min="1" placeholder="200">
</div>

<div class="form-grupo">
<label for="input-link-capa">Link da Capa (opcional)</label>
<input type="url" id="input-link-capa" placeholder="https://...">
</div>

<div class="form-grupo">
<label for="input-upload-capa">Upload da Capa (opcional — substitui o link)</label>
<input type="file" id="input-upload-capa" accept="image/*">
<small class="form-dica" id="dica-upload-capa"></small>
</div>

<div class="form-grupo">
<label for="input-status">Status</label>
<select id="input-status">
<option value="quero-ler">Quero Ler</option>
<option value="lendo">Lendo</option>
<option value="lido">Lido</option>
</select>
</div>

<div class="form-acoes">
<button type="submit" class="botao-primario" id="btn-submit-form">Adicionar ao Acervo</button>
<button type="button" class="botao-secundario" id="btn-cancelar-adicao">Cancelar</button>
</div>
</form>
</div>

<div id="itens-dinamicos-container"></div>

</main>

<div class="modal-overlay" id="modal-progresso" aria-hidden="true">
<div class="modal-conteudo" role="dialog" aria-labelledby="modal-titulo" aria-modal="true">
<h2 id="modal-titulo">Em qual pagina voce parou?</h2>
<p class="modal-livro"></p>
<div class="modal-input-grupo">
<label for="input-pagina">Pagina:</label>
<input type="number" id="input-pagina" min="0" placeholder="42">
<span class="modal-total"></span>
</div>
<div class="modal-acoes">
<button class="botao-secundario" id="modal-cancelar">Cancelar</button>
<button class="botao-primario" id="modal-salvar">Salvar pagina</button>
</div>
</div>
</div>

<button class="btn-flutuante" id="btn-marcar-pagina" aria-label="Marcar pagina" title="Marcar pagina de leitura">
&#128209;
</button>

<footer class="footer">
<div class="container footer-interno">
<p>Acervo Pessoal &copy; 2025 &middot; Feito com HTML + CSS + JS</p>
</div>
</footer>

<script>
(function() {
var CHAVE_ITENS = 'acervo-itens-dinamicos';
var CHAVE_PROGRESSO = 'acervo-progresso';
var capaBase64Temp = null;

function lsDisponivel() {
try { var t = '__test__'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return true; }
catch (e) { return false; }
}

function lerItens() {
if (!lsDisponivel()) return {};
var d = localStorage.getItem(CHAVE_ITENS);
return d ? JSON.parse(d) : {};
}

function salvarItem(slug, item) {
if (!lsDisponivel()) { alert('localStorage indisponivel. Desative o modo privado do navegador.'); return false; }
var itens = lerItens();
itens[slug] = item;
localStorage.setItem(CHAVE_ITENS, JSON.stringify(itens));
return true;
}

function removerItem(slug) {
var itens = lerItens();
delete itens[slug];
localStorage.setItem(CHAVE_ITENS, JSON.stringify(itens));
var prog = JSON.parse(localStorage.getItem(CHAVE_PROGRESSO) || '{}');
delete prog[slug];
localStorage.setItem(CHAVE_PROGRESSO, JSON.stringify(prog));
}

function gerarSlug(titulo) {
return titulo.toLowerCase().normalize('NFD')
.replace(/[\u0300-\u036f]/g, '')
.replace(/[^a-z0-9]+/g, '-')
.replace(/^-|-$/g, '');
}

function calcularPct(atual, total) {
if (!total || total <= 0) return 0;
return Math.round((atual / total) * 100);
}

function classePct(pct) {
if (pct >= 76) return 'progresso-100';
if (pct >= 51) return 'progresso-75';
if (pct >= 26) return 'progresso-50';
if (pct >= 1) return 'progresso-25';
return 'progresso-0';
}

function criarCard(slug, item) {
var prog = JSON.parse(localStorage.getItem(CHAVE_PROGRESSO) || '{}');
var dp = prog[slug] || {};
var pct = calcularPct(dp.paginaAtual || 0, item.totalPaginas || 1);
var cls = classePct(pct);
var status = dp.status || item.status || 'quero-ler';
var pagAtual = dp.paginaAtual || 0;

var sc = status === 'lido' ? 'status-lido' : status === 'lendo' ? 'status-lendo' : 'status-quero-ler';
var st = status === 'lido' ? 'Lido' : status === 'lendo' ? 'Lendo' : 'Quero Ler';

var capaSrc = item.capaBase64 || item.linkCapa || '';

var el = document.createElement('article');
el.className = 'livro livro-dinamico';
el.setAttribute('data-slug', slug);
if (item.totalPaginas) el.setAttribute('data-total-paginas', item.totalPaginas);

var capaHtml;
if (capaSrc) {
capaHtml = '<img src="' + capaSrc + '" alt="' + item.titulo + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
+ '<div class="capa-placeholder capa-fallback" style="display:none"><span class="capa-titulo">' + item.titulo + '</span><span class="capa-autor">' + (item.autor || '') + '</span></div>';
} else {
capaHtml = '<div class="capa-placeholder"><span class="capa-titulo">' + item.titulo + '</span><span class="capa-autor">' + (item.autor || '') + '</span></div>';
}

el.innerHTML =
'<div class="livro-capa">' + capaHtml +
'<span class="status ' + sc + '">' + st + '</span></div>' +
'<div class="livro-info"><h3><a href="' + item.linkPdf + '" target="_blank" rel="noopener">' + item.titulo + '</a></h3>' +
(item.autor ? '<p class="livro-autor">' + item.autor + '</p>' : '') +
(item.categoria ? '<p class="livro-categoria">' + item.categoria + '</p>' : '') +
(pagAtual > 0 ? '<div class="progresso ' + cls + '" aria-label="' + pct + '% lido"></div><span class="pagina-atual">pag. ' + pagAtual + '</span>' : '') +
'</div>' +
'<button class="btn-remover-dinamico" data-slug="' + slug + '" aria-label="Remover ' + item.titulo + '" title="Remover">&times;</button>' +
'<button class="btn-editar-dinamico" data-slug="' + slug + '" aria-label="Editar ' + item.titulo + '" title="Editar">&#9998;</button>';

return el;
}

function renderizarDinamicos() {
var container = document.getElementById('itens-dinamicos-container');
if (!container) return;

var itens = lerItens();
var slugs = Object.keys(itens);
if (slugs.length === 0) return;

var secao = document.createElement('section');
secao.className = 'estante';
secao.setAttribute('aria-label', 'PDFs adicionados');
secao.innerHTML = '<h2>Adicionados Recentemente</h2>';

var prat = document.createElement('div');
prat.className = 'prateleira';

slugs.forEach(function(slug) {
prat.appendChild(criarCard(slug, itens[slug]));
});

secao.appendChild(prat);
container.appendChild(secao);

prat.querySelectorAll('.btn-remover-dinamico').forEach(function(btn) {
btn.addEventListener('click', function(e) {
e.stopPropagation();
var s = btn.getAttribute('data-slug');
var itens = lerItens();
if (confirm('Remover "' + itens[s].titulo + '" do acervo?')) {
removerItem(s);
location.reload();
}
});
});

prat.querySelectorAll('.btn-editar-dinamico').forEach(function(btn) {
btn.addEventListener('click', function(e) {
e.stopPropagation();
abrirFormEdicao(btn.getAttribute('data-slug'));
});
});
}

function abrirFormAdicao() {
var form = document.getElementById('form-adicionar-pdf');
var formContainer = document.getElementById('container-form-adicionar');
var tituloEl = document.getElementById('form-titulo');
var submitBtn = document.getElementById('btn-submit-form');
var slugEdicao = document.getElementById('input-slug-edicao');

slugEdicao.value = '';
tituloEl.textContent = 'Adicionar PDF';
submitBtn.textContent = 'Adicionar ao Acervo';
form.reset();
capaBase64Temp = null;
var dica = document.getElementById('dica-upload-capa');
if (dica) dica.textContent = '';

formContainer.classList.add('form-ativo');
formContainer.setAttribute('aria-hidden', 'false');
setTimeout(function() {
formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
var inp = formContainer.querySelector('#input-titulo');
if (inp) inp.focus();
}, 50);
}

function abrirFormEdicao(slug) {
var itens = lerItens();
var item = itens[slug];
if (!item) return;

var form = document.getElementById('form-adicionar-pdf');
var formContainer = document.getElementById('container-form-adicionar');
var tituloEl = document.getElementById('form-titulo');
var submitBtn = document.getElementById('btn-submit-form');
var slugEdicao = document.getElementById('input-slug-edicao');

slugEdicao.value = slug;
tituloEl.textContent = 'Editar PDF';
submitBtn.textContent = 'Salvar Alteracoes';

document.getElementById('input-titulo').value = item.titulo || '';
document.getElementById('input-autor').value = item.autor || '';
document.getElementById('input-categoria').value = item.categoria || 'programacao';
document.getElementById('input-link-pdf').value = item.linkPdf || '';
document.getElementById('input-total-paginas').value = item.totalPaginas || '';
document.getElementById('input-link-capa').value = item.linkCapa || '';
document.getElementById('input-status').value = item.status || 'quero-ler';

capaBase64Temp = item.capaBase64 || null;
var dica = document.getElementById('dica-upload-capa');
if (dica) dica.textContent = capaBase64Temp ? 'Capa atual carregada. Selecione novo arquivo para substituir.' : '';

formContainer.classList.add('form-ativo');
formContainer.setAttribute('aria-hidden', 'false');
setTimeout(function() {
formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
var inp = formContainer.querySelector('#input-titulo');
if (inp) inp.focus();
}, 50);
}

function configurarFormulario() {
var form = document.getElementById('form-adicionar-pdf');
var btnAbrir = document.getElementById('btn-adicionar-pdf');
var btnCancelar = document.getElementById('btn-cancelar-adicao');
var formContainer = document.getElementById('container-form-adicionar');
var inputUploadCapa = document.getElementById('input-upload-capa');

if (!form || !formContainer || !btnAbrir) return;

btnAbrir.addEventListener('click', function(e) {
e.preventDefault();
e.stopPropagation();
abrirFormAdicao();
});

if (inputUploadCapa) {
inputUploadCapa.addEventListener('change', function(e) {
var file = e.target.files[0];
if (!file) { capaBase64Temp = null; return; }
if (file.size > 500000) {
alert('Imagem muito grande (' + Math.round(file.size / 1024) + 'KB). Maximo recomendado: 500KB.');
e.target.value = '';
capaBase64Temp = null;
return;
}
var reader = new FileReader();
reader.onload = function(ev) {
capaBase64Temp = ev.target.result;
var dica = document.getElementById('dica-upload-capa');
if (dica) dica.textContent = 'Imagem carregada: ' + file.name + ' (' + Math.round(file.size / 1024) + 'KB)';
};
reader.readAsDataURL(file);
});
}

if (btnCancelar) {
btnCancelar.addEventListener('click', function() {
formContainer.classList.remove('form-ativo');
formContainer.setAttribute('aria-hidden', 'true');
form.reset();
capaBase64Temp = null;
var dica = document.getElementById('dica-upload-capa');
if (dica) dica.textContent = '';
});
}

form.addEventListener('submit', function(e) {
e.preventDefault();

var slugEdicao = document.getElementById('input-slug-edicao').value;
var titulo = document.getElementById('input-titulo').value.trim();
var autor = document.getElementById('input-autor').value.trim();
var categoria = document.getElementById('input-categoria').value;
var linkPdf = document.getElementById('input-link-pdf').value.trim();
var totalPaginas = parseInt(document.getElementById('input-total-paginas').value, 10) || 0;
var linkCapa = document.getElementById('input-link-capa').value.trim();
var status = document.getElementById('input-status').value;

if (!titulo || !linkPdf) return;

var slug = slugEdicao || gerarSlug(titulo);

if (slugEdicao && slugEdicao !== slug) {
var itens = lerItens();
if (itens[slugEdicao]) {
delete itens[slugEdicao];
localStorage.setItem(CHAVE_ITENS, JSON.stringify(itens));
var prog = JSON.parse(localStorage.getItem(CHAVE_PROGRESSO) || '{}');
if (prog[slugEdicao]) {
prog[slug] = prog[slugEdicao];
delete prog[slugEdicao];
localStorage.setItem(CHAVE_PROGRESSO, JSON.stringify(prog));
}
}
}

var item = {
titulo: titulo,
autor: autor,
categoria: categoria,
linkPdf: linkPdf,
linkCapa: linkCapa,
totalPaginas: totalPaginas,
status: status,
dataAdicao: slugEdicao ? (lerItens()[slug] || {}).dataAdicao || new Date().toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
tipo: 'dinamico'
};

if (capaBase64Temp) {
item.capaBase64 = capaBase64Temp;
} else if (slugEdicao) {
var existente = lerItens()[slugEdicao] || {};
if (existente.capaBase64 && !linkCapa) {
item.capaBase64 = existente.capaBase64;
}
}

if (status !== 'quero-ler') {
var prog = JSON.parse(localStorage.getItem(CHAVE_PROGRESSO) || '{}');
prog[slug] = prog[slug] || {};
prog[slug].status = status;
if (status === 'lido' && totalPaginas) prog[slug].paginaAtual = totalPaginas;
localStorage.setItem(CHAVE_PROGRESSO, JSON.stringify(prog));
}

if (!salvarItem(slug, item)) return;

form.reset();
capaBase64Temp = null;
var dica = document.getElementById('dica-upload-capa');
if (dica) dica.textContent = '';
formContainer.classList.remove('form-ativo');
formContainer.setAttribute('aria-hidden', 'true');
location.reload();
});
}

function configurarModalHome() {
var overlay = document.getElementById('modal-progresso');
if (!overlay) return;

var btnCancelar = overlay.querySelector('#modal-cancelar');
if (btnCancelar) {
btnCancelar.onclick = function() {
overlay.classList.remove('modal-ativo');
overlay.setAttribute('aria-hidden', 'true');
};
}

overlay.addEventListener('click', function(e) {
if (e.target === overlay) {
overlay.classList.remove('modal-ativo');
overlay.setAttribute('aria-hidden', 'true');
}
});

document.addEventListener('keydown', function(e) {
if (e.key === 'Escape') {
overlay.classList.remove('modal-ativo');
overlay.setAttribute('aria-hidden', 'true');
var formContainer = document.getElementById('container-form-adicionar');
if (formContainer) {
formContainer.classList.remove('form-ativo');
formContainer.setAttribute('aria-hidden', 'true');
}
}
});
}

function lerProgressoItem(slug) {
var dados = localStorage.getItem(CHAVE_PROGRESSO);
if (!dados) return null;
var prog = JSON.parse(dados);
return prog[slug] || null;
}

function salvarProgresso(slug, paginaAtual, totalPaginas) {
var dados = localStorage.getItem(CHAVE_PROGRESSO);
var prog = dados ? JSON.parse(dados) : {};

var status;
if (paginaAtual <= 0) status = 'quero-ler';
else if (paginaAtual >= totalPaginas) status = 'lido';
else status = 'lendo';

prog[slug] = {
paginaAtual: paginaAtual,
totalPaginas: totalPaginas,
status: status,
dataAtualizacao: new Date().toISOString().split('T')[0]
};
localStorage.setItem(CHAVE_PROGRESSO, JSON.stringify(prog));
return prog[slug];
}

function renderizarBarra(elemento, paginaAtual, totalPaginas) {
if (!elemento) return;
var pct = calcularPct(paginaAtual, totalPaginas);
var cls = classePct(pct);
elemento.className = 'progresso ' + cls;
elemento.setAttribute('aria-label', pct + '% lido');
var pagLabel = elemento.parentElement ? elemento.parentElement.querySelector('.pagina-atual') : null;
if (pagLabel && totalPaginas) pagLabel.textContent = 'pag. ' + paginaAtual;
}

function atualizarStatus(elemento, status) {
if (!elemento) return;
elemento.className = 'status';
if (status === 'lido') { elemento.classList.add('status-lido'); elemento.textContent = 'Lido'; }
else if (status === 'lendo') { elemento.classList.add('status-lendo'); elemento.textContent = 'Lendo'; }
else { elemento.classList.add('status-quero-ler'); elemento.textContent = 'Quero Ler'; }
}

document.addEventListener('DOMContentLoaded', function() {
var livros = document.querySelectorAll('.livro');
livros.forEach(function(livro) {
var slug = livro.getAttribute('data-slug');
var total = parseInt(livro.getAttribute('data-total-paginas'), 10) || 0;
var dados = lerProgressoItem(slug);

if (dados) {
var barra = livro.querySelector('.progresso');
var paginaLabel = livro.querySelector('.pagina-atual');
var statusEl = livro.querySelector('.status');

if (barra) renderizarBarra(barra, dados.paginaAtual, dados.totalPaginas);
if (paginaLabel && dados.paginaAtual > 0) paginaLabel.textContent = 'pag. ' + dados.paginaAtual;
if (statusEl) atualizarStatus(statusEl, dados.status);
}
});

renderizarDinamicos();
configurarFormulario();
configurarModalHome();

var ultimoSlug = null;
var livrosComModal = document.querySelectorAll('.livro[data-slug]');
livrosComModal.forEach(function(livro) {
livro.addEventListener('click', function(e) {
if (e.target.closest('a') || e.target.closest('.btn-remover-dinamico') || e.target.closest('.btn-editar-dinamico')) return;
var slug = livro.getAttribute('data-slug');
var total = parseInt(livro.getAttribute('data-total-paginas'), 10) || 0;
var titulo = livro.querySelector('h3') ? livro.querySelector('h3').textContent.trim() : slug;
ultimoSlug = slug;

var overlay = document.getElementById('modal-progresso');
if (!overlay) return;
var tituloEl = overlay.querySelector('.modal-livro');
var inputEl = overlay.querySelector('#input-pagina');
var totalEl = overlay.querySelector('.modal-total');
if (tituloEl) tituloEl.textContent = titulo;
if (inputEl) {
inputEl.max = total || 9999;
inputEl.value = '';
var prog = JSON.parse(localStorage.getItem(CHAVE_PROGRESSO) || '{}');
if (prog[slug]) inputEl.value = prog[slug].paginaAtual || '';
}
if (totalEl) totalEl.textContent = total ? ('de ' + total) : '';
overlay.classList.add('modal-ativo');
overlay.setAttribute('aria-hidden', 'false');
if (inputEl) inputEl.focus();

var btnSalvar = overlay.querySelector('#modal-salvar');
if (btnSalvar) {
btnSalvar.onclick = function() {
var pagina = parseInt(inputEl.value, 10);
if (isNaN(pagina) || pagina < 0) { inputEl.style.borderColor = '#e94560'; return; }
var livroEl = document.querySelector('.livro[data-slug="' + slug + '"]');
if (!livroEl) return;
var t = parseInt(livroEl.getAttribute('data-total-paginas'), 10) || 0;
var resultado = salvarProgresso(slug, pagina, t);
var barra = livroEl.querySelector('.progresso');
var paginaLabel = livroEl.querySelector('.pagina-atual');
var statusEl = livroEl.querySelector('.status');
if (barra) renderizarBarra(barra, pagina, t);
if (paginaLabel && pagina > 0) paginaLabel.textContent = 'pag. ' + pagina;
if (statusEl) atualizarStatus(statusEl, resultado.status);

var itens = lerItens();
if (itens[slug]) {
itens[slug].status = resultado.status;
if (resultado.status === 'lido' && itens[slug].totalPaginas) {
}
salvarItem(slug, itens[slug]);
}

overlay.classList.remove('modal-ativo');
overlay.setAttribute('aria-hidden', 'true');
};
}
});
});

var btnFlutuante = document.getElementById('btn-marcar-pagina');
if (btnFlutuante) {
btnFlutuante.addEventListener('click', function() {
var slugAlvo = ultimoSlug;
if (!slugAlvo) {
var primeiro = document.querySelector('.livro[data-slug]');
if (primeiro) slugAlvo = primeiro.getAttribute('data-slug');
}
if (slugAlvo) {
var livroEl = document.querySelector('.livro[data-slug="' + slugAlvo + '"]');
if (livroEl) livroEl.click();
}
});
}

if (typeof configurarExportar === 'function') configurarExportar();
if (typeof configurarImportar === 'function') configurarImportar();
});
})();
</script>

<script src="./js/exportar.js"></script>
<script src="./js/importar.js"></script>

</body>
</html>
