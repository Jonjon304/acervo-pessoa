<article class="livro" data-slug="dont-make-me-think" data-total-paginas="216">

<div class="capa-placeholder">

<script src="../js/progresso.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function() {
var livros = document.querySelectorAll('.livro');
livros.forEach(function(livro) {
var slug = livro.getAttribute('data-slug');
var dados = lerProgressoItem(slug);
if (dados) {
var barra = livro.querySelector('.progresso');
var paginaLabel = livro.querySelector('.pagina-atual');
var statusEl = livro.querySelector('.status');
if (barra) renderizarBarraProgresso(barra, dados.paginaAtual, dados.totalPaginas);
if (paginaLabel && dados.paginaAtual > 0) paginaLabel.textContent = 'pag. ' + dados.paginaAtual;
if (statusEl) atualizarStatusBadge(statusEl, dados.status);
}
});
});
</script>
