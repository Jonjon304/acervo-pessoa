<script>
(function() {
var CHAVE_ITENS = 'acervo-itens-dinamicos';

function lsDisponivel() {
try { var t = '__test__'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return true; }
catch (e) { return false; }
}

function lerItens() {
if (!lsDisponivel()) return {};
var d = localStorage.getItem(CHAVE_ITENS);
return d ? JSON.parse(d) : {};
}

function atualizarContagens() {
var itens = lerItens();
var contagens = {};

Object.keys(itens).forEach(function(slug) {
var cat = itens[slug].categoria;
if (cat) contagens[cat] = (contagens[cat] || 0) + 1;
});

var cards = document.querySelectorAll('.categoria-card[data-categoria]');
cards.forEach(function(card) {
var cat = card.getAttribute('data-categoria');
var n = contagens[cat] || 0;
var el = card.querySelector('.categoria-contagem');
if (el) el.textContent = n === 1 ? '1 item' : n + ' itens';
});
}

document.addEventListener('DOMContentLoaded', atualizarContagens);
})();
</script>
